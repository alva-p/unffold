name: Release

# Tag `extension-vX.Y.Z` → GitHub Release with the Chrome Web Store zip.
# Tag `vX.Y.Z` → npm publish (needs the NPM_TOKEN secret) + GitHub Release.
# Notes come from the matching CHANGELOG.md section ("## Extension X.Y.Z" / "## CLI X.Y.Z").
on:
  push:
    tags: ['v*', 'extension-v*']

permissions:
  contents: write
  id-token: write  # npm provenance

jobs:
  extension:
    if: startsWith(github.ref_name, 'extension-v')
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tag matches manifest version
        run: |
          version=$(node -p "require('./extension/manifest.json').version")
          test "extension-v$version" = "$GITHUB_REF_NAME" || { echo "manifest is $version, tag is $GITHUB_REF_NAME"; exit 1; }
      - run: npm run release:extension
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#extension-v}
          node scripts/changelog-section.mjs "Extension $version" > notes.md
          gh release create "$GITHUB_REF_NAME" "releases/unffold-extension-$version.zip" \
            --title "Extension $version" --notes-file notes.md --latest=false

  cli:
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Tag matches package version
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "package.json is $version, tag is $GITHUB_REF_NAME"; exit 1; }
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/changelog-section.mjs "CLI ${GITHUB_REF_NAME#v}" > notes.md
          gh release create "$GITHUB_REF_NAME" --title "CLI ${GITHUB_REF_NAME#v}" --notes-file notes.md
